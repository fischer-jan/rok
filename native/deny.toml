# Only permissive licences are allowed. `cargo deny check licenses` enforces this.
[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
